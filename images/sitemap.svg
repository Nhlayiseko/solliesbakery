<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Sollie's Bakery sitemap</title>
  <desc>Home page at the top, linking to five child pages: About Us, Menu, Gallery, Custom Orders, and Contact.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Home page -->
  <rect x="260" y="40" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Home</text>
  <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">index.html</text>

  <!-- Connectors -->
  <line x1="340" y1="96" x2="340" y2="118" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="100.5" y1="118" x2="580.5" y2="118" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="100.5" y1="118" x2="100.5" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="220.5" y1="118" x2="220.5" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="340.5" y1="118" x2="340.5" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="460.5" y1="118" x2="460.5" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="580.5" y1="118" x2="580.5" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- About Us -->
  <rect x="48" y="140" width="105" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="100.5" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">About Us</text>
  <text x="100.5" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">about.html</text>

  <!-- Menu -->
  <rect x="168" y="140" width="105" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="220.5" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Menu</text>
  <text x="220.5" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">products.html</text>

  <!-- Gallery -->
  <rect x="288" y="140" width="105" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340.5" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Gallery</text>
  <text x="340.5" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">gallery.html</text>

  <!-- Custom Orders -->
  <rect x="408" y="140" width="105" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="460.5" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Custom Orders</text>
  <text x="460.5" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">enquiry.html</text>

  <!-- Contact -->
  <rect x="528" y="140" width="105" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="580.5" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Contact</text>
  <text x="580.5" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">contact.html</text>

</svg>
